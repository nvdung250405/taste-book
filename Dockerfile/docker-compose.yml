services:
  # Cấu hình cho Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: TasteBookDB     
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # Cấu hình cho Backend (Node.js)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      REACT_URL: http://localhost:3000
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE_NAME: TasteBookDB
      DB_USERNAME: postgres
      DB_PASSWORD: root
      DB_DIALECT: postgres
    depends_on:
      - db
    networks:
      - app-network

  # Cấu hình cho Frontend (React/Vite)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge