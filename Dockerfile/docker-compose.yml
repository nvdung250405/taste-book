services:
  # Cấu hình cho Database PostgreSQL
  db:
    image: postgres:15-alpine
    container_name: postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
      POSTGRES_DB: taste_book_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # Cấu hình cho Backend (Node.js)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      REACT_URL: http://localhost:5173
      DB_HOST: postgresql
      DB_PORT: 5432
      DB_DATABASE_NAME: taste_book_db
      DB_USERNAME: postgres
      DB_PASSWORD: password123
      DB_DIALECT: postgres
    depends_on:
      - db
    networks:
      - app-network

  # Cấu hình cho Frontend (React/Vite)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
