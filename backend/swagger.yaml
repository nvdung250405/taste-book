              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: Chưa xác thực hoặc phiên đăng nhập đã hết hạn!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
