        - Shopping Lists
      summary: "7.8. UC-18: Xóa các mặt hàng đã mua"
      description: "Xóa tất cả mặt hàng có isPurchased = true trong danh sách thuộc người dùng đăng nhập. Giữ nguyên danh sách, trạng thái chuyến đi chợ, các liên kết thực đơn và mặt hàng chưa mua. Không cần request body. Không có mặt hàng đã mua vẫn trả 200 với deletedItems = 0. Thao tác thực hiện trong transaction và rollback khi lỗi trước khi commit thành công."
      security:
        - bearerAuth: []
      parameters:
        - name: shoppingListId
          in: path
          required: true
          description: "Mã danh sách dạng chữ số thập phân nguyên dương, không có dấu cách hoặc số 0 ở đầu."
          schema:
            type: integer
            minimum: 1
            maximum: 2147483647
          example: 5
      responses:
        "200":
          description: Xóa thành công, kể cả khi không có mặt hàng đã mua
          content:
            application/json:
              schema:
                type: object
                required: [EC, EM, DT]
                properties:
                  EC:
                    type: integer
                    enum: [0]
                  EM:
                    type: string
                  DT:
                    type: object
                    required: [shoppingListId, deletedItems]
                    properties:
                      shoppingListId:
                        type: integer
                      deletedItems:
                        type: integer
                        minimum: 0
              examples:
                deleted:
                  value:
                    EC: 0
                    EM: "Đã xóa các mặt hàng đã mua!"
                    DT:
                      shoppingListId: 5
                      deletedItems: 3
                nonePurchased:
                  value:
                    EC: 0
                    EM: "Đã xóa các mặt hàng đã mua!"
                    DT:
                      shoppingListId: 5
                      deletedItems: 0
        "400":
          description: Mã danh sách đi chợ không hợp lệ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: "Mã danh sách đi chợ không hợp lệ!"
                DT: null
        "401":
          description: Chưa xác thực hoặc token không hợp lệ, hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: "Chưa xác thực hoặc phiên đăng nhập đã hết hạn!"
                DT: null
        "403":
          description: Không phải chủ sở hữu danh sách đi chợ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 4
                EM: "Bạn không có quyền xóa mặt hàng trong danh sách đi chợ này!"
                DT: null
        "404":
          description: Không tìm thấy danh sách đi chợ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 3
                EM: "Không tìm thấy danh sách đi chợ!"
                DT: null
        "500":
          description: Lỗi hệ thống server hoặc CSDL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: "Lỗi kết nối máy chủ!"
                DT: null
  /images:
    post:
      tags:
        - Images
      summary: "8.1: Tải lên hình ảnh"
      description: "Tải 1 file hình ảnh lên Cloudinary (hỗ trợ các định dạng .jpg, .jpeg, .png, .webp với dung lượng tối đa 5MB)."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - file
              properties:
                file:
                  type: string
                  format: binary
                  description: File ảnh cần tải lên (tối đa 5MB)
      responses:
        "201":
          description: Tải lên thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Tải ảnh lên thành công!
                DT:
                  imageUrl: https://res.cloudinary.com/sf4yjct9/image/upload/v1788611681/tastebook_uploads/example.png
                  publicId: tastebook_uploads/example
        "400":
          description: Không có file đính kèm, sai định dạng hoặc vượt quá 5MB
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: File không hợp lệ hoặc vượt quá dung lượng tối đa 5MB!
                DT: null
        "401":
          description: Chưa xác thực Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: Chưa xác thực hoặc phiên đăng nhập đã hết hạn!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  /images/{publicId}:
    delete:
      tags:
        - Images
      summary: "8.2: Xóa hình ảnh trên Cloudinary theo publicId"
      description: "Xóa vĩnh viễn hình ảnh lưu trữ trên Cloudinary thông qua mã định danh publicId được truyền trên URI (Lưu ý: Nếu publicId chứa tiền tố thư mục dạng folder/image_id, client cần mã hóa URL Encode trước khi truyền vào đường dẫn)."
      security:
        - bearerAuth: []
      parameters:
        - name: publicId
          in: path
          required: true
          description: Mã định danh ảnh trên Cloudinary (URL Encoded nếu có ký tự '/')
          schema:
            type: string
          example: tastebook_uploads%2Fsample
      responses:
        "200":
          description: Đã xóa ảnh thành công!
          content:
