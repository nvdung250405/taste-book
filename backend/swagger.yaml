openapi: 3.0.3
info:
  title: TasteBook API Specification
  description: >-
    Tài liệu đặc tả RESTful API chính thức cho nền tảng TasteBook (Phiên bản
    Sprint 2).

    Toàn bộ các API tuân thủ cấu trúc phản hồi chuẩn 3 trường: { EC, EM, DT }.

    - EC (Error Code): 0 (Thành công), 1 (Tham số không hợp lệ), 2 (Trùng lặp dữ liệu), 3 (Không tìm thấy tài nguyên), 4 (Không có quyền), 5 (Chưa đăng nhập/Hết hạn token), 6 (Sai thông tin đăng nhập), -1 (Lỗi máy chủ).

    - EM (Error Message): Thông điệp phản hồi chi tiết.

    - DT (Data): Dữ liệu trả về (Object, Array hoặc null).
  version: 1.0.0
servers:
  - url: http://localhost:5000/api/v1
    description: Local Development Server
tags:
  - name: Authentication
    description: "UC-02, UC-03, UC-04: Đăng ký, Đăng nhập, Đăng xuất"
  - name: Home
    description: "UC-01: Lấy dữ liệu công thức Trang chủ (mới nhất và thịnh hành)"
  - name: User Profile
    description: "UC-05: Xem thông tin cá nhân, cập nhật hồ sơ, đổi mật khẩu"
  - name: Admin Users
    description: "UC-24: Quản trị danh sách người dùng và chi tiết người dùng"
  - name: Categories
    description: "UC-06, UC-08, UC-25: Xem danh mục món ăn, tạo/sửa/xóa danh mục cá nhân"
  - name: Admin Categories
    description: "UC-21: Quản trị danh mục món ăn chuẩn hệ thống"
  - name: Ingredients & Units
    description: "UC-22, UC-23: Từ điển nguyên liệu, nhóm nguyên liệu và đơn vị đo chuẩn"
  - name: Recipes
    description: "UC-06, UC-07: Tìm kiếm, lọc món ăn, xem chi tiết và tính toán khẩu
      phần ăn N người"
  - name: User Recipes
    description: "UC-08, UC-09, UC-10, UC-11: Tạo công thức mới, quản lý, chỉnh sửa
      và xóa mềm công thức"
  - name: Admin Recipes
    description: "UC-19, UC-20: Quản trị công thức hệ thống và duyệt bài viết
      (Pending / Approved / Rejected)"
  - name: Favorites
    description: "UC-12: Quản lý danh sách món yêu thích và ghi chú nấu nướng cá nhân"
  - name: Recipe Lists
    description: "UC-13, UC-14, UC-15, UC-16: Quản lý thực đơn và các món ăn trong thực đơn"
  - name: Shopping Lists
    description: "UC-17, UC-18: Quản lý phiên đi chợ, gộp nguyên liệu tự động và
      checklist mua sắm"
  - name: Images
    description: Tải lên và xóa hình ảnh qua dịch vụ Cloudinary
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Nhập JWT Bearer Token lấy từ API đăng nhập
  schemas:
    StandardResponse:
      type: object
      properties:
        EC:
          type: integer
          example: 0
          description: Error Code
        EM:
          type: string
          example: Thao tác thành công!
          description: Error Message
        DT:
          nullable: true
          description: Data payload
    ErrorResponse:
      type: object
      properties:
        EC:
          type: integer
          example: 1
        EM:
          type: string
          example: Dữ liệu không hợp lệ!
        DT:
          type: "null"
          example: null
paths:
  /home:
    get:
      tags:
        - Home
      summary: "UC-01: Lấy dữ liệu công thức Trang chủ (mới nhất và thịnh hành)"
      description: Lấy danh sách các công thức nấu ăn mới nhất và các công thức thịnh hành (được yêu thích nhiều nhất) hiển thị công khai trên trang chủ.
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 6
          description: Số lượng món ăn lấy ra cho mỗi mục (mặc định 6)
      responses:
        "200":
          description: Lấy dữ liệu trang chủ thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Lấy dữ liệu trang chủ thành công!
                DT:
                  latestRecipes:
                    - recipeId: 105
                      title: Canh chua cá lóc miền Tây
                      thumbnailUrl: https://res.cloudinary.com/tastebook/image/upload/v1/recipes/canhchua.jpg
                      cookTimeMinutes: 35
                      difficulty: Medium
                      defaultServings: 4
                      author:
                        userId: 10
                        username: Nguyễn Văn A
                      categories:
                        - categoryId: 1
                          categoryName: Món Canh
                      createdAt: "2026-08-25T08:30:00.000Z"
                  trendingRecipes:
                    - recipeId: 101
                      title: Bò lúc lắc sốt tiêu đen
                      thumbnailUrl: https://res.cloudinary.com/tastebook/image/upload/v1/recipes/bo.jpg
                      cookTimeMinutes: 25
                      difficulty: Easy
                      defaultServings: 2
                      favoriteCount: 45
                      author:
                        userId: 2
                        username: Bếp Trưởng Hoàng
                      categories:
                        - categoryId: 2
                          categoryName: Món Xào
                      createdAt: "2026-08-20T10:00:00.000Z"
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  /auth/register:
    post:
      tags:
        - Authentication
      summary: "UC-02: Đăng ký tài khoản người dùng mới"
      description: Tiếp nhận thông tin đăng ký, kiểm tra trùng lặp email/SĐT, mã hóa
        Bcrypt mật khẩu và tạo tài khoản với vai trò User.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
                - email
                - password
                - confirmPassword
                - phone
              properties:
                username:
                  type: string
                  example: Nguyễn Văn A
                email:
                  type: string
                  format: email
                  example: vana@gmail.com
                password:
                  type: string
                  minLength: 6
                  example: Password123@
                confirmPassword:
                  type: string
                  example: Password123@
                phone:
                  type: string
                  example: "0912345678"
      responses:
        "201":
          description: Đăng ký tài khoản thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Đăng ký tài khoản thành công!
                DT:
                  userId: 10
                  username: Nguyễn Văn A
                  email: vana@gmail.com
                  phone: "0912345678"
                  role: User
        "400":
          description: Lỗi dữ liệu đầu vào hoặc thiếu tham số bắt buộc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Dữ liệu đầu vào không hợp lệ!
                DT: null
        "409":
          description: Dữ liệu đã tồn tại hoặc bị trùng lặp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 2
                EM: Dữ liệu đã tồn tại trên hệ thống!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  /auth/login:
    post:
      tags:
        - Authentication
      summary: "UC-03: Đăng nhập vào hệ thống"
      description: Xác thực người dùng bằng Email/SĐT và mật khẩu; trả về Access Token
        JWT và thông tin tài khoản.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - valueLogin
                - password
              properties:
                valueLogin:
                  type: string
                  example: chef.hoang@tastebook.vn
                  description: Email hoặc số điện thoại
                password:
                  type: string
                  example: "123456"
      responses:
        "200":
          description: Đăng nhập thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Đăng nhập thành công!
                DT:
                  accessToken: eyJhbGciOiJIUzI1NiIsIn...
                  user:
                    userId: 2
                    username: Bếp Trưởng Hoàng
                    email: chef.hoang@tastebook.vn
                    phone: "0912345678"
                    role: User
        "400":
          description: Lỗi dữ liệu đầu vào hoặc thiếu tham số bắt buộc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Dữ liệu đầu vào không hợp lệ!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: "UC-04: Đăng xuất khỏi hệ thống"
      description: Hủy phiên làm việc phía client.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Đăng xuất thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Đăng xuất thành công!
                DT: null
        "401":
          description: Chưa gửi token hoặc token hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: Chưa xác thực hoặc phiên đăng nhập đã hết hạn!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  /users/me:
    get:
      tags:
        - User Profile
      summary: "UC-05: Lấy thông tin cá nhân của người dùng hiện tại"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lấy thông tin hồ sơ thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Lấy thông tin hồ sơ thành công!
                DT:
                  userId: 3
                  username: Nguyễn Thị Lan Anh
                  email: lananh.kitchen@gmail.com
                  phone: "0987654321"
                  avatarUrl: https://res.cloudinary.com/...
                  role: User
                  createdAt: 2026-09-06T13:57:01Z
        "400":
          description: Lỗi dữ liệu đầu vào hoặc thiếu tham số bắt buộc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Dữ liệu đầu vào không hợp lệ!
                DT: null
        "401":
          description: Token không hợp lệ hoặc hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: Phiên làm việc không hợp lệ!
                DT: null
        "404":
          description: Không tìm thấy người dùng trong CSDL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 3
                EM: Không tìm thấy người dùng trên hệ thống!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
    put:
      tags:
        - User Profile
      summary: "UC-05: Cập nhật thông tin hồ sơ cá nhân"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - username
              properties:
                username:
                  type: string
                  example: Lan Anh MasterChef
                phone:
                  type: string
                  example: "0987654321"
                avatarUrl:
                  type: string
                  example: https://res.cloudinary.com/...
      responses:
        "200":
          description: Cập nhật hồ sơ thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Cập nhật hồ sơ thành công!
                DT:
                  userId: 3
                  username: Lan Anh MasterChef
                  phone: "0987654321"
                  avatarUrl: https://res.cloudinary.com/...
        "400":
          description: Lỗi dữ liệu đầu vào hoặc thiếu tham số bắt buộc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Dữ liệu đầu vào không hợp lệ!
                DT: null
        "401":
          description: Chưa xác thực hoặc token hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: Vui lòng đăng nhập để thực hiện!
                DT: null
        "409":
          description: Dữ liệu đã tồn tại hoặc bị trùng lặp
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 2
                EM: Số điện thoại đã được đăng ký trên hệ thống!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  /users/me/password:
    put:
      tags:
        - User Profile
      summary: "UC-05: Đổi mật khẩu tài khoản"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - oldPassword
                - newPassword
                - confirmNewPassword
              properties:
                oldPassword:
                  type: string
                  example: "123456"
                newPassword:
                  type: string
                  minLength: 6
                  example: NewPass@123
                confirmNewPassword:
                  type: string
                  example: NewPass@123
      responses:
        "200":
          description: Đổi mật khẩu thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Đổi mật khẩu thành công!
                DT: null
        "400":
          description: Mật khẩu mới trùng mật khẩu cũ hoặc không khớp xác nhận
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Mật khẩu mới không được trùng mật khẩu cũ hoặc xác nhận không khớp!
                DT: null
        "401":
          description: Mật khẩu hiện tại không chính xác hoặc chưa đăng nhập
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 6
                EM: Mật khẩu hiện tại không chính xác!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  /categories:
    get:
      tags:
        - Categories
      summary: "UC-06/08: Lấy danh mục hiển thị (Danh mục hệ thống + danh mục do user
        tạo)"
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lấy danh sách danh mục thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Lấy danh sách danh mục thành công!
                DT:
                  - id: 1
                    categoryName: Món chính
                    createdBy: null
                  - id: 2
                    categoryName: Món canh
                    createdBy: null
        "400":
          description: Lỗi dữ liệu đầu vào hoặc thiếu tham số bắt buộc
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Dữ liệu đầu vào không hợp lệ!
                DT: null
        "500":
          description: Lỗi kết nối máy chủ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
    post:
      tags:
        - Categories
      summary: "UC-25: Tạo danh mục món ăn cá nhân (User)"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryName
              properties:
                categoryName:
                  type: string
                  example: Món ăn giảm cân
      responses:
        "201":
          description: Tạo danh mục cá nhân thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Tạo danh mục cá nhân thành công!
                DT:
                  categoryId: 15
                  categoryName: Món Ăn Kiêng
                  createdBy: 10
        "400":
          description: Tên danh mục rỗng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Tên danh mục không được để trống!
                DT: null
        "401":
          description: Chưa xác thực hoặc phiên đăng nhập đã hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: Chưa xác thực hoặc phiên đăng nhập đã hết hạn!
                DT: null
        "409":
          description: Tên danh mục đã tồn tại trong kho cá nhân
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 2
                EM: Danh mục này đã tồn tại trong danh sách của bạn!
                DT: null
        "500":
          description: Lỗi hệ thống server hoặc CSDL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: -1
                EM: Lỗi kết nối máy chủ!
                DT: null
  "/categories/{categoryId}":
    put:
      tags:
        - Categories
      summary: "UC-25: Chỉnh sửa danh mục món ăn cá nhân"
      security:
        - bearerAuth: []
      parameters:
        - name: categoryId
          in: path
          required: true
          schema:
            type: integer
          example: 9
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryName
              properties:
                categoryName:
                  type: string
                  example: Món Healthy & EatClean
      responses:
        "200":
          description: Cập nhật danh mục thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Cập nhật danh mục thành công!
                DT:
                  categoryId: 15
                  categoryName: Món Eat Clean
        "400":
          description: Tên danh mục rỗng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Tên danh mục không được để trống!
                DT: null
        "401":
          description: Chưa xác thực hoặc phiên đăng nhập đã hết hạn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: Chưa xác thực hoặc phiên đăng nhập đã hết hạn!
                DT: null
        "403":
          description: Sửa danh mục không do mình tạo ra
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 4
                EM: Bạn không có quyền chỉnh sửa danh mục này!
                DT: null
        "404":
          description: Không tìm thấy danh mục
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 3
                EM: Không tìm thấy danh mục cần cập nhật!
