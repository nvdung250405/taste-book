    post:
      tags:
        - User Recipes
      summary: "UC-08: Người dùng tạo công thức món ăn mới"
      description: |
        User và Admin đều có thể tạo công thức cá nhân qua API này. Nếu isPublic = false hoặc không truyền, công thức được lưu riêng tư với approvalStatus = 'Approved'. Nếu isPublic = true, công thức được lưu với approvalStatus = 'Pending' để chờ duyệt, kể cả khi tác giả là Admin.
        Nguyên liệu định tính dùng quantity = 0 với unitId hoặc customUnit mang đơn vị như "vừa đủ", "tùy khẩu vị", "nêm nếm". Nguyên liệu định lượng phải có quantity > 0. Với ingredientId chuẩn, chỉ được sử dụng unitId bằng defaultUnitId của nguyên liệu; bỏ unitId thì dùng đơn vị mặc định. Không được nhập customUnit cho nguyên liệu chuẩn; vi phạm trả HTTP 400, EC: 1. Hệ thống lưu đúng tên đơn vị và không tự quy đổi giữa các đơn vị.
        Công thức có tác giả là Admin sau khi được duyệt công khai sẽ trở thành công thức chuẩn hệ thống.
        FE: Khi tài khoản Admin chọn gửi công khai, hiển thị xác nhận trước khi gọi API và chỉ gửi khi người dùng đồng ý:
        "Chú ý: bạn đang là tài khoản quản trị viên, khi công thức này được phê duyệt ra hệ thống thì sẽ trở thành công thức chuẩn của hệ thống. Bạn có chắc chắn không?"
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - cookTimeMinutes
                - difficulty
                - defaultServings
                - isPublic
                - categories
                - ingredients
                - cookingSteps
              properties:
                title:
                  type: string
                  example: Bò xào hành cần tây
                description:
                  type: string
                  example: Món bò xào giòn ngọt đậm đà
                thumbnailUrl:
                  type: string
                  example: https://res.cloudinary.com/...
                cookTimeMinutes:
                  type: integer
                  minimum: 1
                  example: 20
                difficulty:
                  type: string
                  enum:
                    - Easy
                    - Medium
                    - Hard
                  example: Easy
                defaultServings:
                  type: integer
                  minimum: 1
                  example: 3
                isPublic:
                  type: boolean
                  example: true
                categories:
                  type: array
                  items:
                    type: integer
                  example:
                    - 1
                    - 4
                ingredients:
                  type: array
                  items:
                    type: object
                    properties:
                      ingredientId:
                        type: integer
                        nullable: true
                        example: 2
                      customIngredientName:
                        type: string
                        nullable: true
                        example: null
                      quantity:
                        type: number
                        minimum: 0
                        description: "Số dương cho đơn vị định lượng; dùng 0 khi đơn vị là định tính (ví dụ customUnit: 'vừa đủ')."
                        example: 300
                      unitId:
                        type: integer
                        nullable: true
                        description: "Với ingredientId chuẩn, phải bằng defaultUnitId; bỏ trường này hoặc gửi null thì dùng mặc định. Với nguyên liệu tự nhập, có thể chọn đơn vị hệ thống bất kỳ."
                        example: 1
                      customUnit:
                        type: string
                        nullable: true
                        description: "Chỉ dùng cho nguyên liệu tự nhập (customIngredientName), ví dụ 'trái to' hoặc 'vừa đủ'. Nguyên liệu chuẩn (ingredientId) không được nhập customUnit."
                        example: null
                cookingSteps:
                  type: array
                  items:
                    type: object
                    required:
                      - stepNumber
                      - instruction
                    properties:
                      stepNumber:
                        type: integer
                        minimum: 1
                        example: 1
                      instruction:
                        type: string
                        example: Thịt bò thái mỏng ướp tỏi và gia vị...
      responses:
        "201":
          description: Tạo công thức món ăn thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: Tạo công thức thành công! Đang chờ phê duyệt.
                DT:
                  recipeId: 105
                  approvalStatus: Pending
        "400":
          description: Thiếu trường bắt buộc, nguyên liệu, bước nấu hoặc quantity = 0 với đơn vị định lượng
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 1
                EM: Công thức phải có ít nhất 1 nguyên liệu và 1 bước làm!
                DT: null
        "401":
          description: Chưa xác thực hoặc token hết hạn
          content:
