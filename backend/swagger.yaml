            type: integer
          description: Lọc theo danh mục món ăn
        - name: ingredientId
          in: query
          schema:
            type: integer
          description: Lọc theo nguyên liệu
        - name: difficulty
          in: query
          schema:
            type: string
            enum:
              - Easy
              - Medium
              - Hard
          description: Lọc theo độ khó (Easy, Medium, Hard)
        - name: cookingTime
          in: query
          schema:
            type: integer
          description: Thời gian nấu tối đa (phút)
        - name: page
          in: query
          schema:
            type: integer
            default: 1
          description: Trang hiện tại (mặc định 1)
        - name: limit
          in: query
          schema:
            type: integer
            default: 10
          description: Số lượng bản ghi trên một trang (mặc định 10, tối đa 100)
        - name: sortBy
          in: query
          schema:
            type: string
            enum:
              - createdAt
              - cookTimeMinutes
              - title
            default: createdAt
          description: Tiêu chí sắp xếp (createdAt, cookTimeMinutes, title)
        - name: sortOrder
          in: query
          schema:
            type: string
            enum:
              - ASC
              - DESC
            default: DESC
          description: Chiều sắp xếp (ASC, DESC)
      responses:
        "200":
          description: Lấy dữ liệu và phân trang thành công
          content:
            application/json:
              schema:
