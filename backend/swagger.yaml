                  summary: Thực đơn chưa có món ăn
                  value:
                    EC: 1
                    EM: "Thực đơn được chọn chưa có món ăn nào để đi chợ!"
                    DT: null
                missingTitle:
                  summary: Tiêu đề để trống
                  value:
                    EC: 1
                    EM: "Tiêu đề danh sách đi chợ phải là chuỗi không được để trống!"
                    DT: null
                missingRecipeLists:
                  summary: Chưa chọn thực đơn
                  value:
                    EC: 1
                    EM: "Vui lòng chọn ít nhất một thực đơn!"
                    DT: null
                invalidListIds:
                  summary: Danh sách mã thực đơn không hợp lệ
                  value:
                    EC: 1
                    EM: "Danh sách mã thực đơn không hợp lệ!"
                    DT: null
                invalidServings:
                  value:
                    EC: 1
                    EM: "Khẩu phần targetServings và defaultServings phải là số nguyên dương!"
                    DT: null
                quantityTooSmall:
                  value:
                    EC: 1
                    EM: "Số lượng sau làm tròn phải từ 0.01 trở lên với đơn vị định lượng!"
                    DT: null
                quantityOverflow:
                  value:
                    EC: 1
                    EM: "Số lượng sau làm tròn không được vượt quá 99999999.99!"
                    DT: null
                titleTooLong:
                  value:
                    EC: 1
                    EM: "Tiêu đề danh sách đi chợ không được vượt quá 100 ký tự!"
                    DT: null
        "401":
          description: Chưa xác thực Token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              example:
                EC: 5
                EM: "Chưa xác thực hoặc phiên đăng nhập đã hết hạn!"
                DT: null
        "403":
          description: Không có quyền sử dụng thực đơn của người khác
          content:
