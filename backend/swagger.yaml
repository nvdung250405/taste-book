                    EM: "Đơn vị tính không được để trống!"
                    DT: null
                invalidQuantity:
                  summary: Số lượng không hợp lệ
                  value:
                    EC: 1
                    EM: "Số lượng phải lớn hơn 0; chỉ đơn vị định tính mới được dùng 0!"
                    DT: null
                invalidQuantityType:
                  value:
                    EC: 1
                    EM: "Số lượng phải là số hữu hạn!"
                    DT: null
                quantityTooSmall:
                  value:
                    EC: 1
                    EM: "Số lượng sau làm tròn phải từ 0.01 trở lên với đơn vị định lượng!"
                    DT: null
                quantityOverflow:
