      description: "Gom một hoặc nhiều thực đơn, loại bỏ ID thực đơn trùng. targetServings và defaultServings phải là số nguyên dương. Định lượng được nhân targetServings/defaultServings bằng số học chính xác, cộng dồn theo mã nguyên liệu và đơn vị (trim, không phân biệt hoa thường); nguyên liệu tự nhập gộp theo tên và đơn vị. Khác đơn vị thì tách dòng, không quy đổi. Chỉ làm tròn half-up một lần sau khi cộng tổng, đến 2 chữ số thập phân; kết quả định lượng phải từ 0.01 đến 99999999.99, nếu không trả 400. Nguyên liệu định tính giữ unit và totalQuantity = 0, không nhân hoặc cộng số lượng."
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - recipeListIds
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: "Chuỗi không rỗng sau khi trim."
                  example: "Đi siêu thị BigC"
                recipeListIds:
                  type: array
                  minItems: 1
                  description: "Các ID số nguyên dương; ID trùng được xử lý một lần, không nhận chuỗi hoặc boolean."
                  items:
                    type: integer
                    minimum: 1
                  example:
                    - 1
                    - 2
      responses:
        "201":
          description: Tổng hợp danh sách đi chợ thành công
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: "Đã tổng hợp danh sách đi chợ thông minh thành công!"
                DT:
                  shoppingListId: 5
                  title: "Đi siêu thị BigC"
                  status: "In_Progress"
                  totalItems: 15
        "400":
          description: Dữ liệu đầu vào không hợp lệ hoặc thực đơn chưa có món ăn
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
