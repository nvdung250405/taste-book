    post:
      tags:
        - Shopping Lists
      summary: "UC-18: Thêm món mua ngoài tự do"
      description: "Thêm mặt hàng phát sinh. itemName và unit phải là chuỗi không rỗng sau trim, tối đa 255 ký tự. totalQuantity nếu có phải là số JSON hữu hạn (không nhận chuỗi, boolean hoặc null). Đơn vị định lượng bắt buộc có totalQuantity > 0; làm tròn half-up đến 2 chữ số thập phân, kết quả phải từ 0.01 đến 99999999.99, nếu không trả 400. Đơn vị định tính có thể bỏ totalQuantity hoặc gửi số không âm, luôn lưu totalQuantity = 0."
      security:
        - bearerAuth: []
      parameters:
        - name: shoppingListId
          in: path
          required: true
          schema:
            type: integer
          example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - itemName
                - unit
              properties:
                itemName:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: Nước rửa chén
                totalQuantity:
                  type: number
                  minimum: 0
                  description: "Bắt buộc với đơn vị định lượng, kết quả sau làm tròn half-up phải từ 0.01 đến 99999999.99. Đơn vị định tính có thể bỏ trường này, nếu gửi phải là số không âm; luôn lưu 0. Không nhận null, chuỗi hoặc boolean."
                  example: 1
                unit:
                  type: string
                  minLength: 1
                  maxLength: 255
                  example: chai
      responses:
        "201":
          description: Thêm món phát sinh thành công!
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StandardResponse"
              example:
                EC: 0
                EM: "Thêm món phát sinh thành công!"
                DT:
                  itemId: 55
                  itemName: "Nước rửa chén"
                  totalQuantity: 1
                  unit: "chai"
                  isPurchased: false
