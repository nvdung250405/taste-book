version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgresql
    restart: always
    environment:
      POSTGRES_DB: TasteBookDB
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
